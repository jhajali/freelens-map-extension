apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: integration-tests
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      containers:
      - name: web
        image: registry.k8s.io/pause:3.10
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: integration-tests
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
  - port: 80
